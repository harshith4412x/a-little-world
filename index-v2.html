<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f4ef" id="themeMeta">
<title>A Little World of Personalities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="profiles.js"></script>
<style>
:root {
  --ink: #22201e;
  --ink-soft: #4d4843;
  --muted: #7a746c;
  --paper: #f7f4ef;
  --card: #fffefa;
  --card-glass: rgba(255, 254, 250, 0.9);
  --deck-1: #ede4da;
  --deck-2: #f5eee6;
  --line: #e6dfd5;
  --line-strong: #d4c7b8;
  --accent: #a66850;
  --accent-bg: #f5ebe4;
  --sage-bg: #e9efe8;
  --sage-ink: #5c7060;
  --rose-bg: #f3e8ec;
  --rose-ink: #9c5f73;
  --glow-1: rgba(235, 217, 203, 0.65);
  --glow-2: rgba(226, 236, 225, 0.65);
  --shadow-sm: 0 6px 24px rgba(46, 36, 27, 0.04);
  --shadow: 0 24px 64px rgba(46, 36, 27, 0.09);
  --serif: "Newsreader", Georgia, serif;
  --sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
}

[data-theme="dark"] {
  --ink: #f2ece4;
  --ink-soft: #cfc6ba;
  --muted: #968d82;
  --paper: #161412;
  --card: #1f1c19;
  --card-glass: rgba(31, 28, 25, 0.9);
  --deck-1: #26221e;
  --deck-2: #2c2722;
  --line: #302b26;
  --line-strong: #473f37;
  --accent: #d8967c;
  --accent-bg: #2e221d;
  --sage-bg: #202922;
  --sage-ink: #9cb3a0;
  --rose-bg: #2b1f24;
  --rose-ink: #d494a8;
  --glow-1: rgba(166, 104, 80, 0.14);
  --glow-2: rgba(126, 145, 129, 0.12);
  --shadow-sm: 0 8px 26px rgba(0, 0, 0, 0.25);
  --shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }

.app {
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  background:
    radial-gradient(circle at 88% 4%, var(--glow-1) 0%, transparent 32%),
    radial-gradient(circle at 6% 88%, var(--glow-2) 0%, transparent 30%),
    var(--paper);
}

.app::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.22;
  background-image: radial-gradient(#8c7f70 0.5px, transparent 0.5px);
  background-size: 18px 18px;
  z-index: 0;
}

.topbar, main { position: relative; z-index: 1; }

.topbar {
  max-width: 1120px;
  margin: auto;
  padding: 24px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  font-size: 12.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  cursor: pointer;
}
.brand span { color: var(--accent); }

.top-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.top-note {
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
  font-family: var(--serif);
}

.theme-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card-glass);
  color: var(--ink);
  display: grid;
  place-items: center;
  font-size: 14px;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.theme-btn:hover {
  transform: scale(1.06);
  border-color: var(--line-strong);
}

main {
  max-width: 1120px;
  margin: auto;
  padding: 24px 26px 76px;
}

.fade-in {
  animation: fadeUp 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}

.hero {
  max-width: 760px;
  margin: 26px auto 42px;
  text-align: center;
}

.hero h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(44px, 7.2vw, 78px);
  line-height: 1.01;
  letter-spacing: -0.035em;
  margin: 16px 0 18px;
}

.hero h1 em {
  font-style: italic;
  color: var(--accent);
}

.hero p {
  max-width: 500px;
  margin: 0 auto;
  color: var(--muted);
  line-height: 1.75;
  font-size: 15px;
}

.home-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  max-width: 960px;
  margin: 46px auto 0;
}

.home-card {
  min-height: 245px;
  text-align: left;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 26px;
  background: var(--card-glass);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow-sm);
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease, border-color 0.28s ease;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  color: var(--ink);
}

.home-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow);
  border-color: var(--line-strong);
  background: var(--card);
}

.home-icon {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: var(--accent-bg);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size: 20px;
  margin-bottom: 28px;
  transition: transform 0.28s ease;
}

.home-card:hover .home-icon { transform: scale(1.06) rotate(-3deg); }
.home-card:nth-child(2) .home-icon { background: var(--sage-bg); color: var(--sage-ink); }
.home-card:nth-child(3) .home-icon { background: var(--rose-bg); color: var(--rose-ink); }

.home-card h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 24px;
  margin: 0 0 10px;
  letter-spacing: -0.015em;
}

.home-card p {
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--muted);
  margin: 0;
}

.arrow {
  margin-top: auto;
  padding-top: 22px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: gap 0.2s ease;
}

.home-card:hover .arrow { gap: 9px; }

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.14em;
  margin-top: 58px;
}

/* Panels & Forms */
.panel {
  max-width: 720px;
  margin: 14px auto 0;
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.back {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 8px 0;
  font-size: 13px;
  font-weight: 500;
  transition: color 0.2s;
}
.back:hover { color: var(--ink); }

.step {
  font-size: 11.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

.surface {
  background: var(--card-glass);
  border: 1px solid var(--line);
  border-radius: 30px;
  padding: clamp(26px, 5vw, 46px);
  box-shadow: var(--shadow);
}

h2.screen-title {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(30px, 4.8vw, 42px);
  line-height: 1.12;
  margin: 10px 0 14px;
  letter-spacing: -0.025em;
}

.sub {
  color: var(--muted);
  line-height: 1.7;
  font-size: 14.5px;
  margin: 0;
}

.field {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px 18px;
  background: var(--card);
  color: var(--ink);
  font-size: 15px;
  outline: none;
  margin-top: 24px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(166, 104, 80, 0.12);
}

/* Integrated Search Bar with Enter Button */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 24px;
  padding: 6px 6px 6px 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-bar:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(166, 104, 80, 0.12);
}

.search-bar input {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-size: 15px;
  outline: none;
  min-width: 0;
}

.search-submit {
  border: 0;
  background: var(--ink);
  color: var(--paper);
  border-radius: 999px;
  padding: 11px 22px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: opacity 0.2s ease, transform 0.18s ease;
}

.search-submit:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

.search-hint-box {
  margin-top: 20px;
  padding: 16px 18px;
  border-radius: 16px;
  border: 1px dashed var(--line-strong);
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  display: flex;
  align-items: center;
  gap: 10px;
}

.primary {
  border: 0;
  background: var(--ink);
  color: var(--paper);
  border-radius: 999px;
  padding: 14px 24px;
  font-size: 13.5px;
  font-weight: 600;
  transition: transform 0.18s ease, opacity 0.2s ease, box-shadow 0.2s ease;
}
.primary:hover {
  opacity: 0.9;
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
}

.secondary {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  border-radius: 999px;
  padding: 13px 22px;
  font-size: 13.5px;
  font-weight: 500;
  transition: background 0.2s, border-color 0.2s;
}
.secondary:hover:not(:disabled) {
  background: var(--accent-bg);
  border-color: var(--line-strong);
}
.secondary:disabled { opacity: 0.4; cursor: not-allowed; }

.actions {
  display: flex;
  gap: 12px;
  justify-content: space-between;
  align-items: center;
  margin-top: 26px;
}

.progress {
  height: 4px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
  margin: 18px 0 24px;
}

.progress span {
  height: 100%;
  display: block;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

.options {
  display: grid;
  gap: 11px;
  margin-top: 24px;
}

.option {
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
  text-align: left;
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.5;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: all 0.2s ease;
}

.option::before {
  content: "";
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  flex-shrink: 0;
  transition: all 0.2s ease;
}

.option:hover { border-color: var(--line-strong); }

.option.selected {
  border-color: var(--accent);
  background: var(--accent-bg);
  font-weight: 500;
}

.option.selected::before {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: inset 0 0 0 3.5px var(--accent-bg);
}

textarea {
  width: 100%;
  min-height: 82px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 16px;
  background: var(--card);
  color: var(--ink);
  margin-top: 16px;
  outline: none;
  font-size: 13.5px;
  line-height: 1.6;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.spark-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
}

.spark-chip {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12px;
  transition: all 0.18s ease;
}

.spark-chip:hover {
  border-color: var(--accent);
  color: var(--ink);
  background: var(--accent-bg);
}

/* Search Results */
.person-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 22px;
}

.person {
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
  text-align: left;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}

.person:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-sm);
  border-color: var(--accent);
}

.person h3 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 24px;
  margin: 0 0 6px;
  color: var(--ink);
}

.person p {
  font-size: 13px;
  color: var(--muted);
  margin: 0;
  line-height: 1.55;
}

.person span {
  display: inline-block;
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  margin-top: 16px;
}

/* Story Deck */
.story-wrap {
  max-width: 700px;
  margin: 14px auto;
}

.story-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.story-count {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

.deck {
  position: relative;
  min-height: 415px;
  perspective: 1200px;
  touch-action: pan-y;
}

.deck::before, .deck::after {
  content: "";
  position: absolute;
  border-radius: 30px;
  border: 1px solid var(--line);
  transition: transform 0.3s ease;
}

.deck::before {
  inset: 14px 16px -10px;
  background: var(--deck-1);
  transform: rotate(2deg);
  z-index: 0;
}

.deck::after {
  inset: 7px 8px -5px;
  background: var(--deck-2);
  transform: rotate(-1deg);
  z-index: 0;
}

.story-card {
  position: relative;
  z-index: 1;
  min-height: 415px;
  border-radius: 30px;
  background: var(--card);
  border: 1px solid var(--line);
  padding: clamp(28px, 6vw, 48px);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  user-select: none;
  cursor: grab;
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease;
}

.story-card:active { cursor: grabbing; }
.story-card.dragging { transition: none; }

.card-kicker {
  font-size: 10.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}

.card-title {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(31px, 5vw, 46px);
  line-height: 1.08;
  letter-spacing: -0.025em;
  margin: 18px 0 20px;
}

.card-body {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(16.5px, 2.3vw, 19.5px);
  line-height: 1.78;
  color: var(--ink-soft);
  white-space: pre-line;
}

.card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 34px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  gap: 10px;
  flex-wrap: wrap;
}

.card-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.pill-btn {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 11.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.2s ease;
}

.pill-btn:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}

.pill-btn.active {
  border-color: var(--accent);
  background: var(--accent-bg);
  color: var(--accent);
}

.dots {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin: 26px 0 12px;
  flex-wrap: wrap;
}

.dots i {
  height: 5px;
  width: 16px;
  border-radius: 99px;
  background: var(--line-strong);
  cursor: pointer;
  transition: all 0.25s ease;
}

.dots i.active {
  background: var(--accent);
  width: 30px;
}

.swipe-hint {
  text-align: center;
  font-size: 11.5px;
  color: var(--muted);
}

.story-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 18px;
}

.round {
  width: 48px;
  height: 48px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--card);
  color: var(--ink);
  font-size: 17px;
  display: grid;
  place-items: center;
  transition: all 0.2s ease;
}

.round:hover:not(:disabled) {
  border-color: var(--line-strong);
  transform: scale(1.05);
}

.round.next {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

.round:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.deep-btn {
  height: 48px;
  padding: 0 20px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  background: var(--accent-bg);
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.deep-btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

/* Deeper Reflection Chatbot Modal/Drawer */
.chat-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 18, 16, 0.52);
  backdrop-filter: blur(5px);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
  animation: fadeInBg 0.22s ease;
}

@keyframes fadeInBg {
  from { opacity: 0; }
  to { opacity: 1; }
}

.chat-sheet {
  width: 100%;
  max-width: 620px;
  height: min(78vh, 640px);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 28px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: slideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

.chat-head {
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chat-head-title {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 500;
  margin: 2px 0 0;
}

.chat-close {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-size: 16px;
  display: grid;
  place-items: center;
}
.chat-close:hover { color: var(--ink); border-color: var(--line-strong); }

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.msg {
  max-width: 84%;
  padding: 13px 16px;
  border-radius: 20px;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-line;
}

.msg.bot {
  align-self: flex-start;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 15.5px;
  border-bottom-left-radius: 6px;
}

.msg.user {
  align-self: flex-end;
  background: var(--ink);
  color: var(--paper);
  border-bottom-right-radius: 6px;
}

.chat-prompts {
  padding: 8px 22px 10px;
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: none;
}
.chat-prompts::-webkit-scrollbar { display: none; }

.chat-prompt-chip {
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.18s ease;
}
.chat-prompt-chip:hover {
  border-color: var(--accent);
  color: var(--ink);
}

.chat-input-row {
  padding: 12px 16px 16px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 8px;
  align-items: center;
}

.chat-input-row input {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 999px;
  padding: 12px 16px;
  font-size: 14px;
  outline: none;
}
.chat-input-row input:focus { border-color: var(--accent); }

.chat-send {
  border: 0;
  background: var(--accent);
  color: #fff;
  border-radius: 999px;
  padding: 12px 20px;
  font-size: 13px;
  font-weight: 600;
}
.chat-send:disabled { opacity: 0.45; cursor: not-allowed; }

.notice {
  padding: 14px 16px;
  border-radius: 14px;
  background: var(--accent-bg);
  color: var(--accent);
  font-size: 13px;
  line-height: 1.55;
  margin-top: 16px;
}

.loader-bars {
  display: flex;
  gap: 6px;
  margin-top: 24px;
}
.loader-bars span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.2s infinite ease-in-out;
}
.loader-bars span:nth-child(2) { animation-delay: 0.2s; }
.loader-bars span:nth-child(3) { animation-delay: 0.4s; }

@keyframes pulse {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

@media (max-width: 720px) {
  .home-grid { grid-template-columns: 1fr; max-width: 470px; }
  .home-card { min-height: 185px; }
  .home-icon { margin-bottom: 18px; }
  .hero { margin-top: 14px; }
  .topbar { padding: 18px 20px; }
  .top-note { display: none; }
  main { padding: 18px 18px 54px; }
  .person-list { grid-template-columns: 1fr; }
  .deck, .story-card { min-height: 380px; }
  .chat-backdrop { padding: 0; }
  .chat-sheet { border-radius: 24px 24px 0 0; height: 84vh; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand" onclick="home()">A LITTLE <span>WORLD</span> OF PERSONALITIES</div>
    <div class="top-right">
      <div class="top-note">A space to understand people gently</div>
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" aria-label="Switch reading theme" title="Switch reading theme">☾</button>
    </div>
  </header>

  <main id="appMain">
    <section class="hero fade-in">
      <div class="eyebrow">A small journey inward</div>
      <h1>Every mind has<br>its own <em>little world.</em></h1>
      <p>Explore the ways people think, feel, understand and see the world. No labels. No perfect answers. Just thoughtful stories.</p>
      <div class="home-grid">
        <button class="home-card" id="discover">
          <div class="home-icon">✳</div>
          <h2>Discover your personality</h2>
          <p>Answer thoughtful questions and receive a personality story shaped by your responses.</p>
          <div class="arrow">Begin your journey <span>↗</span></div>
        </button>
        <button class="home-card" id="predefined">
          <div class="home-icon">❀</div>
          <h2>Explore personalities</h2>
          <p>Search for a specific name and uncover their written story, one card at a time.</p>
          <div class="arrow">Search stories <span>↗</span></div>
        </button>
        <button class="home-card" id="private">
          <div class="home-icon">♡</div>
          <h2>Know me better</h2>
          <p>A personal space with a little more to discover. Password protected.</p>
          <div class="arrow">Enter privately <span>↗</span></div>
        </button>
      </div>
      <div class="footer">MADE WITH CURIOSITY & CARE</div>
    </section>
  </main>
</div>

<script>
const WORKER_URL = "https://gentle-wood-0b71.harshith4412x.workers.dev/";
const main = document.getElementById("appMain");
const homeMarkup = main.innerHTML;

const questions = [
  { category: "Perception", question: "When something unexpected happens, what do you usually do first?", options: ["I consider different possible explanations", "I focus on the details I notice first", "I trust my immediate impression", "I pause and gather more information"] },
  { category: "Belief systems", question: "When forming an opinion, what tends to influence you most?", options: ["My past experiences", "Values and principles that matter to me", "Evidence and information I can verify", "A mix of different perspectives"] },
  { category: "Belief updating", question: "If you encounter strong evidence against something you believe, what do you tend to do?", options: ["Reconsider my view and look closer", "Take time before changing my mind", "Ask questions and compare both sides", "It depends on how important the belief is"] },
  { category: "Memory and prediction", question: "How much do past experiences shape what you expect next?", options: ["A lot; I often use past patterns", "Somewhat, but I try to stay open", "I focus more on what is happening now", "It depends on the situation"] },
  { category: "Intuition and reasoning", question: "When making an important decision, what do you rely on first?", options: ["My intuition or gut feeling", "Careful reasoning and comparison", "I use intuition, then check it logically", "I ask someone I trust for perspective"] },
  { category: "Metacognition", question: "How often do you step back and examine your own thinking?", options: ["Often; I reflect on why I think this way", "Sometimes, especially after a big decision", "Mostly when something goes wrong", "Not very often; I prefer to act"] },
  { category: "Perspective-taking", question: "When someone disagrees with you, what do you usually try to understand?", options: ["What experiences shaped their view", "The reasons and evidence behind their view", "How they might be feeling", "I first explain how I see it"] },
  { category: "Motives and priorities", question: "In a difficult situation, what matters most to you?", options: ["Feeling safe and prepared", "Maintaining important relationships", "Solving the problem effectively", "Being treated fairly and respectfully"] },
  { category: "Emotion and cognition", question: "How does stress or a strong emotion affect your thinking?", options: ["I become more cautious and think deeply", "I act quickly and process it later", "My thoughts become less organised", "I try to pause until I feel calmer"] },
  { category: "Social and cultural influences", question: "How do your upbringing and surroundings influence your choices?", options: ["They strongly shape my values", "They influence me, but I question things too", "I consciously choose what to keep or change", "I am still figuring out their influence"] }
];

const reflectionSparks = [
  "Depends on who I'm with",
  "Learned this the hard way",
  "I tend to overthink this",
  "Usually automatic for me"
];

let visitorName = "", answers = [], qIndex = 0, selected = -1, storyCards = [], cardIndex = 0, dragStart = null, inStoryView = false, currentStoryOwner = "", currentProfileData = null, chatHistory = [];

function toggleTheme() {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const next = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  document.getElementById("themeToggle").textContent = next === "dark" ? "☀" : "☾";
  document.getElementById("themeMeta").setAttribute("content", next === "dark" ? "#161412" : "#f7f4ef");
  localStorage.setItem("alw-theme", next);
}

(function initTheme() {
  const saved = localStorage.getItem("alw-theme");
  if (saved === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
    document.getElementById("themeToggle").textContent = "☀";
    document.getElementById("themeMeta").setAttribute("content", "#161412");
  }
})();

function home() {
  inStoryView = false;
  closeChat();
  main.innerHTML = homeMarkup;
  wireHome();
}

function wireHome() {
  document.getElementById("discover").onclick = nameScreen;
  document.getElementById("predefined").onclick = predefinedScreen;
  document.getElementById("private").onclick = privateScreen;
}

function shell(content) {
  inStoryView = false;
  closeChat();
  main.innerHTML = `<div class="panel fade-in"><div class="panel-head"><button class="back" onclick="home()">← Back to home</button><span class="step">A LITTLE WORLD</span></div>${content}</div>`;
}

function nameScreen() {
  shell(`
    <section class="surface">
      <div class="eyebrow">Start with your name</div>
      <h2 class="screen-title">Let's begin with you.</h2>
      <p class="sub">There are no right or wrong answers. Just choose what feels closest to how you usually think.</p>
      <input class="field" id="visitorName" maxlength="60" placeholder="Your name" value="${escapeHtml(visitorName)}">
      <div id="nameNotice"></div>
      <div class="actions">
        <span></span>
        <button class="primary" onclick="startQuestions()">Continue →</button>
      </div>
    </section>
  `);
  const input = document.getElementById("visitorName");
  input.focus();
  input.addEventListener("keydown", e => { if (e.key === "Enter") startQuestions(); });
}

function startQuestions() {
  visitorName = document.getElementById("visitorName").value.trim();
  if (!visitorName) {
    document.getElementById("nameNotice").innerHTML = '<div class="notice">Please enter your name to begin.</div>';
    return;
  }
  answers = [];
  qIndex = 0;
  renderQuestion();
}

function renderQuestion() {
  const q = questions[qIndex];
  selected = answers[qIndex]?.selected ?? -1;
  const explanation = answers[qIndex]?.explanation || "";
  shell(`
    <section class="surface">
      <div class="eyebrow">${q.category}</div>
      <div class="progress"><span style="width:${((qIndex + 1) / questions.length) * 100}%"></span></div>
      <div class="step">QUESTION ${qIndex + 1} OF ${questions.length}</div>
      <h2 class="screen-title">${q.question}</h2>
      <div class="options">
        ${q.options.map((o, i) => `<button class="option ${i === selected ? "selected" : ""}" onclick="choose(${i})">${o}</button>`).join("")}
      </div>
      <textarea id="explanation" placeholder="Want to add a quick thought on why? (optional)">${escapeHtml(explanation)}</textarea>
      <div class="spark-chips">
        ${reflectionSparks.map(s => `<button type="button" class="spark-chip" onclick="appendSpark('${escapeHtml(s)}')">+ ${escapeHtml(s)}</button>`).join("")}
      </div>
      <div id="qNotice"></div>
      <div class="actions">
        <button class="secondary" onclick="previousQuestion()" ${qIndex === 0 ? "disabled" : ""}>← Previous</button>
        <button class="primary" onclick="nextQuestion()">${qIndex === 9 ? "Create my story ✨" : "Next →"}</button>
      </div>
    </section>
  `);
}

function appendSpark(text) {
  const box = document.getElementById("explanation");
  if (!box) return;
  const current = box.value.trim();
  box.value = current ? `${current} — ${text}` : text;
  box.focus();
}

function choose(i) {
  selected = i;
  document.getElementById("qNotice").innerHTML = "";
  document.querySelectorAll(".option").forEach((el, n) => el.classList.toggle("selected", n === i));
}

function saveAnswer() {
  const explanation = document.getElementById("explanation")?.value || "";
  if (selected < 0) {
    document.getElementById("qNotice").innerHTML = '<div class="notice">Choose the option that feels closest to you before continuing.</div>';
    return false;
  }
  answers[qIndex] = {
    category: questions[qIndex].category,
    question: questions[qIndex].question,
    choice: questions[qIndex].options[selected],
    explanation,
    selected
  };
  return true;
}

function nextQuestion() {
  if (!saveAnswer()) return;
  if (qIndex < 9) {
    qIndex++;
    renderQuestion();
  } else {
    generatePublicStory();
  }
}

function previousQuestion() {
  if (qIndex > 0) {
    const exp = document.getElementById("explanation")?.value || "";
    if (selected >= 0) answers[qIndex] = { ...answers[qIndex], selected, explanation: exp };
    qIndex--;
    renderQuestion();
  }
}

async function generatePublicStory() {
  shell(`
    <section class="surface">
      <div class="eyebrow">Your story is taking shape</div>
      <h2 class="screen-title">A moment of understanding…</h2>
      <p class="sub">Turning your reflections into a thoughtful personality story. This usually takes a few seconds.</p>
      <div class="loader-bars"><span></span><span></span><span></span></div>
    </section>
  `);
  try {
    const r = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: visitorName,
        answers: answers.map(a => ({
          category: a.category,
          question: a.question,
          choice: a.choice,
          explanation: a.explanation || ""
        }))
      })
    });
    const d = await r.json();
    if (!r.ok) throw Error(d.error || "The story could not be created.");
    showStory(d.story, visitorName);
  } catch (e) {
    shell(`
      <section class="surface">
        <div class="eyebrow">Something paused</div>
        <h2 class="screen-title">We couldn't create the story.</h2>
        <p class="sub">${escapeHtml(e.message)}</p>
        <div class="actions"><span></span><button class="primary" onclick="renderQuestion()">Try again</button></div>
      </section>
    `);
  }
}

/* Search-only Explore Personalities with Enter button & zero popups */
function predefinedScreen() {
  shell(`
    <section class="surface">
      <div class="eyebrow">Explore Personalities</div>
      <h2 class="screen-title">Find a written world.</h2>
      <p class="sub">Stories stay tucked away until you look for them. Type a name and press Enter to search.</p>
      <div class="search-bar">
        <input id="personSearch" placeholder="Enter a name..." autocomplete="off">
        <button type="button" class="search-submit" id="searchEnterBtn">Enter ↵</button>
      </div>
      <div id="exploreState">
        <div class="search-hint-box">
          <span>⌕</span>
          <span>Enter a person's name above and press <strong>Enter</strong> to reveal their story.</span>
        </div>
      </div>
      <div id="personResults" class="person-list" aria-live="polite"></div>
    </section>
  `);

  const search = document.getElementById("personSearch");
  const enterBtn = document.getElementById("searchEnterBtn");
  const results = document.getElementById("personResults");
  const stateBox = document.getElementById("exploreState");
  search.focus();

  function executeSearch() {
    const query = search.value.trim().toLowerCase();
    results.innerHTML = "";

    if (!query) {
      stateBox.innerHTML = '<div class="notice">Type a name first, then press Enter to search.</div>';
      return;
    }

    const profiles = window.originalProfiles;
    if (!profiles || typeof profiles !== "object") {
      stateBox.innerHTML = '<div class="notice">Personalities could not be loaded right now. Please try again shortly.</div>';
      return;
    }

    const matches = Object.entries(profiles).filter(([key, profile]) => {
      const displayName = (profile?.displayName || key).toLowerCase();
      return displayName.includes(query) || key.toLowerCase().includes(query);
    });

    if (!matches.length) {
      stateBox.innerHTML = `<div class="notice">No personality story found matching "${escapeHtml(search.value.trim())}".</div>`;
      return;
    }

    stateBox.innerHTML = "";
    matches.forEach(([key, profile]) => {
      const button = document.createElement("button");
      button.className = "person";
      button.type = "button";
      const traitCount = Array.isArray(profile.traits) ? profile.traits.length : 0;
      const preview = Array.isArray(profile.traits) && profile.traits[0]?.title
        ? profile.traits[0].title
        : (traitCount ? `${traitCount} chapters inside` : "Written personality story");

      button.innerHTML = `
        <div>
          <h3>${escapeHtml(profile.displayName || key)}</h3>
          <p>${escapeHtml(preview)}</p>
        </div>
        <span>Open story ↗</span>
      `;
      button.addEventListener("click", () => openPredefined(key));
      results.appendChild(button);
    });
  }

  enterBtn.addEventListener("click", executeSearch);
  search.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      executeSearch();
    }
  });
  search.addEventListener("input", () => {
    if (!search.value.trim()) {
      results.innerHTML = "";
      stateBox.innerHTML = `
        <div class="search-hint-box">
          <span>⌕</span>
          <span>Enter a person's name above and press <strong>Enter</strong> to reveal their story.</span>
        </div>`;
    }
  });
}

function openPredefined(key) {
  const p = window.originalProfiles?.[key];
  const stateBox = document.getElementById("exploreState");
  if (!p) {
    if (stateBox) {
      stateBox.innerHTML = '<div class="notice">This story could not be opened right now.</div>';
    }
    return;
  }
  showStory(p, p.displayName || key);
}

function privateScreen() {
  shell(`
    <section class="surface">
      <div class="eyebrow">A private little world</div>
      <h2 class="screen-title">Know me better.</h2>
      <p class="sub">This story is protected. Enter the private password to continue.</p>
      <input class="field" id="privatePassword" type="password" placeholder="Enter password" autocomplete="current-password">
      <div id="privateError"></div>
      <div class="actions">
        <span></span>
        <button class="primary" onclick="loadPrivate()">Unlock story →</button>
      </div>
    </section>
  `);
  const pwd = document.getElementById("privatePassword");
  pwd.focus();
  pwd.addEventListener("keydown", e => { if (e.key === "Enter") loadPrivate(); });
}

async function loadPrivate() {
  const password = document.getElementById("privatePassword").value;
  if (!password) {
    document.getElementById("privateError").innerHTML = '<div class="notice">Please enter the password.</div>';
    return;
  }
  shell(`
    <section class="surface">
      <div class="eyebrow">Unlocking</div>
      <h2 class="screen-title">Opening the private story…</h2>
      <p class="sub">Just a moment.</p>
      <div class="loader-bars"><span></span><span></span><span></span></div>
    </section>
  `);
  try {
    const r = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "private-profile", password })
    });
    const d = await r.json();
    if (!r.ok) throw Error(d.error || "Unable to unlock profile.");
    showStory(d.story, "Harsha");
  } catch (e) {
    shell(`
      <section class="surface">
        <div class="eyebrow">Access denied</div>
        <h2 class="screen-title">Couldn't unlock the story.</h2>
        <p class="sub">${escapeHtml(e.message)}</p>
        <div class="actions"><span></span><button class="primary" onclick="privateScreen()">Try again</button></div>
      </section>
    `);
  }
}

function showStory(profile, name) {
  currentStoryOwner = name;
  currentProfileData = profile;
  chatHistory = [];

  const traits = Array.isArray(profile.traits) ? profile.traits : [];
  storyCards = [];
  traits.forEach((t, i) => storyCards.push({
    kicker: `PERSONALITY · ${String(i + 1).padStart(2, "0")}`,
    title: t.title || "A little detail",
    body: t.description || "",
    label: `${name} · ${i + 1} / ${traits.length}`,
    liked: false
  }));

  const sections = [
    ["strengths", "MY STRENGTHS"],
    ["cons", "THINGS I'M WORKING ON"],
    ["observations", "OTHER OBSERVATIONS"],
    ["personalMessage", "A PERSONAL MESSAGE"]
  ];

  sections.forEach(([key, label]) => {
    const value = profile[key];
    if (Array.isArray(value)) {
      value.forEach(v => storyCards.push({
        kicker: label,
        title: typeof v === "string" ? label : (v.title || label),
        body: typeof v === "string" ? v : (v.description || v.text || ""),
        label: name,
        liked: false
      }));
    } else if (typeof value === "string" && value.trim()) {
      storyCards.push({
        kicker: label,
        title: label,
        body: value,
        label: name,
        liked: false
      });
    }
  });

  if (profile.ending) {
    storyCards.push({
      kicker: "A FINAL THOUGHT",
      title: "A little something to remember",
      body: profile.ending,
      label: "THE END",
      liked: false
    });
  }

  cardIndex = 0;
  inStoryView = true;

  main.innerHTML = `
    <div class="story-wrap fade-in">
      <div class="story-top">
        <button class="back" onclick="home()">← Home</button>
        <span class="story-count" id="storyCount"></span>
      </div>
      <div class="deck" id="deck">
        <article class="story-card" id="storyCard" ondblclick="toggleResonate()">
          <div>
            <div class="card-kicker" id="cardKicker"></div>
            <h2 class="card-title" id="cardTitle"></h2>
            <div class="card-body" id="cardBody"></div>
          </div>
          <div class="card-bottom">
            <span id="cardLabel"></span>
            <div class="card-actions">
              <button type="button" class="pill-btn" id="resonateBtn" onclick="toggleResonate()">♡ Resonates</button>
              <button type="button" class="pill-btn" onclick="downloadCardImage()" title="Save this card as an image">↓ Save PNG</button>
            </div>
          </div>
        </article>
      </div>
      <div class="dots" id="dots"></div>
      <div class="swipe-hint">Swipe cards, save a PNG, or explore deeper with the reflection guide</div>
      <div class="story-controls">
        <button class="round" id="prevCardBtn" onclick="moveCard(-1)" aria-label="Previous card">←</button>
        <button class="deep-btn" onclick="openChat()">✦ Explore deeper</button>
        <button class="round next" id="nextCardBtn" onclick="moveCard(1)" aria-label="Next card">→</button>
      </div>
    </div>
  `;

  renderCard();

  const deck = document.getElementById("deck");
  const card = document.getElementById("storyCard");

  deck.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    dragStart = { x: e.clientX, y: e.clientY };
    card.classList.add("dragging");
  });

  deck.addEventListener("pointermove", e => {
    if (!dragStart) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      const rotate = dx * 0.04;
      card.style.transform = `translateX(${dx * 0.45}px) rotate(${rotate}deg)`;
    }
  });

  const endDrag = e => {
    if (!dragStart) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    dragStart = null;
    card.classList.remove("dragging");
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      moveCard(dx < 0 ? 1 : -1);
    } else {
      card.style.transform = "translateX(0) rotate(0)";
    }
  };

  deck.addEventListener("pointerup", endDrag);
  deck.addEventListener("pointercancel", () => {
    dragStart = null;
    card.classList.remove("dragging");
    card.style.transform = "translateX(0) rotate(0)";
  });
}

/* Deeper Personality Chatbot */
function openChat() {
  if (document.getElementById("chatBackdrop")) return;
  const activeCard = storyCards[cardIndex];
  if (!chatHistory.length) {
    chatHistory.push({
      role: "bot",
      text: `You're looking at ${currentStoryOwner}'s world—specifically "${activeCard?.title || "their story"}". Ask anything you'd like to understand more deeply about how this mind works, blind spots, or relationships.`
    });
  }

  const backdrop = document.createElement("div");
  backdrop.className = "chat-backdrop";
  backdrop.id = "chatBackdrop";
  backdrop.innerHTML = `
    <div class="chat-sheet" role="dialog" aria-label="Explore personality deeper">
      <div class="chat-head">
        <div>
          <div class="eyebrow">Deeper Reflection</div>
          <div class="chat-head-title">Exploring ${escapeHtml(currentStoryOwner)}'s world</div>
        </div>
        <button type="button" class="chat-close" onclick="closeChat()" aria-label="Close">✕</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-prompts">
        <button type="button" class="chat-prompt-chip" onclick="sendChatPrompt('What might be a hidden blind spot here?')">Hidden blind spot?</button>
        <button type="button" class="chat-prompt-chip" onclick="sendChatPrompt('How does this personality act under stress?')">Behavior under stress?</button>
        <button type="button" class="chat-prompt-chip" onclick="sendChatPrompt('What kind of people feel safest around this mind?')">Closest relationships?</button>
        <button type="button" class="chat-prompt-chip" onclick="sendChatPrompt('Unpack this card in simpler words.')">Unpack current card</button>
      </div>
      <div class="chat-input-row">
        <input id="chatInput" placeholder="Ask a deeper question..." autocomplete="off">
        <button type="button" class="chat-send" id="chatSendBtn" onclick="submitChat()">Send</button>
      </div>
    </div>
  `;

  backdrop.addEventListener("click", e => {
    if (e.target === backdrop) closeChat();
  });

  document.body.appendChild(backdrop);
  renderChatMessages();

  const input = document.getElementById("chatInput");
  input.focus();
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      submitChat();
    }
  });
}

function closeChat() {
  const el = document.getElementById("chatBackdrop");
  if (el) el.remove();
}

function renderChatMessages() {
  const container = document.getElementById("chatMessages");
  if (!container) return;
  container.innerHTML = chatHistory
    .map(m => `<div class="msg ${m.role === "user" ? "user" : "bot"}">${escapeHtml(m.text)}</div>`)
    .join("");
  container.scrollTop = container.scrollHeight;
}

function sendChatPrompt(text) {
  const input = document.getElementById("chatInput");
  if (!input) return;
  input.value = text;
  submitChat();
}

async function submitChat() {
  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("chatSendBtn");
  if (!input || !sendBtn) return;

  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  chatHistory.push({ role: "user", text });
  renderChatMessages();

  sendBtn.disabled = true;
  chatHistory.push({ role: "bot", text: "Thinking gently…" });
  renderChatMessages();

  const activeCard = storyCards[cardIndex];
  const storySummary = storyCards.map(c => `${c.title}: ${c.body}`).join("\n");

  try {
    const r = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "chat",
        name: currentStoryOwner,
        currentCard: activeCard ? { title: activeCard.title, body: activeCard.body } : null,
        storyContext: storySummary,
        messages: chatHistory.slice(0, -1)
      })
    });
    const d = await r.json();
    chatHistory.pop();

    if (r.ok && (d.reply || d.message || d.answer)) {
      chatHistory.push({ role: "bot", text: d.reply || d.message || d.answer });
    } else {
      chatHistory.push({ role: "bot", text: synthesizeLocalReflection(text, activeCard, storyCards, currentStoryOwner) });
    }
  } catch (_) {
    chatHistory.pop();
    chatHistory.push({ role: "bot", text: synthesizeLocalReflection(text, activeCard, storyCards, currentStoryOwner) });
  }

  sendBtn.disabled = false;
  renderChatMessages();
}

function synthesizeLocalReflection(question, activeCard, cards, name) {
  const q = question.toLowerCase();
  const focusTitle = activeCard?.title || "this side of them";
  const focusBody = activeCard?.body || "";
  const firstSentence = focusBody.split(/[.!?]/)[0]?.trim() || "";

  if (q.includes("blind spot") || q.includes("weakness") || q.includes("work")) {
    const workingOn = cards.find(c => c.kicker.includes("WORKING ON"));
    if (workingOn) {
      return `Looking closely at ${name}'s story, the tension often shows up around "${workingOn.title}". ${workingOn.body}`;
    }
    return `Every strength casts a shadow. Because ${name} leans into "${focusTitle}", they can sometimes over-index on ${firstSentence ? firstSentence.toLowerCase() : "internal processing"}—holding back when quicker or simpler openness might lighten the weight.`;
  }

  if (q.includes("stress") || q.includes("conflict") || q.includes("pressure")) {
    return `Under pressure, ${name} tends to retreat into the pattern described in "${focusTitle}". ${firstSentence ? firstSentence + "." : ""} Instead of reacting loudly, they usually try to regain inner footing before letting others see the full picture.`;
  }

  if (q.includes("relationship") || q.includes("friend") || q.includes("safe") || q.includes("people")) {
    return `${name} connects best with people who respect space and depth rather than surface-level small talk. When someone meets "${focusTitle}" with patience instead of rushing them, trust builds quietly and deeply.`;
  }

  return `At the heart of "${focusTitle}" is how ${name} filters the world: ${firstSentence ? firstSentence.toLowerCase() + "." : "quietly, intentionally, and on their own terms."} Notice how this connects to the rest of their cards—it's less about rigid rules and more about staying true to what feels authentic.`;
}

function toggleResonate() {
  const c = storyCards[cardIndex];
  if (!c) return;
  c.liked = !c.liked;
  const btn = document.getElementById("resonateBtn");
  if (btn) {
    btn.classList.toggle("active", c.liked);
    btn.textContent = c.liked ? "♥ Resonates" : "♡ Resonates";
  }
}

function downloadCardImage() {
  const c = storyCards[cardIndex];
  if (!c) return;
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const canvas = document.createElement("canvas");
  canvas.width = 1080;
  canvas.height = 1350;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = isDark ? "#191614" : "#f7f4ef";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = isDark ? "#221e1b" : "#fffefa";
  ctx.strokeStyle = isDark ? "#38312b" : "#e6dfd5";
  ctx.lineWidth = 3;
  roundRect(ctx, 72, 72, 936, 1206, 44);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = isDark ? "#d8967c" : "#a66850";
  ctx.font = "700 22px sans-serif";
  ctx.fillText(c.kicker.toUpperCase(), 140, 175);

  ctx.fillStyle = isDark ? "#f2ece4" : "#22201e";
  ctx.font = "400 62px Georgia, serif";
  let y = wrapText(ctx, c.title, 140, 275, 800, 74);

  ctx.fillStyle = isDark ? "#cfc6ba" : "#4d4843";
  ctx.font = "400 34px Georgia, serif";
  wrapText(ctx, c.body, 140, y + 48, 800, 54);

  ctx.strokeStyle = isDark ? "#38312b" : "#ece5dc";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(140, 1140);
  ctx.lineTo(940, 1140);
  ctx.stroke();

  ctx.fillStyle = isDark ? "#968d82" : "#7a746c";
  ctx.font = "600 22px sans-serif";
  ctx.fillText(c.label.toUpperCase(), 140, 1195);
  ctx.textAlign = "right";
  ctx.fillText("A LITTLE WORLD", 940, 1195);

  const link = document.createElement("a");
  link.download = `${(currentStoryOwner || "story").toLowerCase().replace(/\s+/g, "-")}-card-${cardIndex + 1}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const paragraphs = String(text).split("\n");
  paragraphs.forEach(p => {
    const words = p.split(" ");
    let line = "";
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + " ";
      if (ctx.measureText(testLine).width > maxWidth && n > 0) {
        ctx.fillText(line.trim(), x, y);
        line = words[n] + " ";
        y += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line.trim(), x, y);
    y += lineHeight;
  });
  return y;
}

function jumpCard(i) {
  cardIndex = i;
  renderCard();
}

function renderCard() {
  const c = storyCards[cardIndex];
  if (!c) return;
  document.getElementById("cardKicker").textContent = c.kicker;
  document.getElementById("cardTitle").textContent = c.title;
  document.getElementById("cardBody").textContent = c.body;
  document.getElementById("cardLabel").textContent = c.label;
  document.getElementById("storyCount").textContent = `CARD ${cardIndex + 1} OF ${storyCards.length}`;

  const btn = document.getElementById("resonateBtn");
  if (btn) {
    btn.classList.toggle("active", !!c.liked);
    btn.textContent = c.liked ? "♥ Resonates" : "♡ Resonates";
  }

  document.getElementById("dots").innerHTML = storyCards
    .map((_, i) => `<i class="${i === cardIndex ? "active" : ""}" onclick="jumpCard(${i})"></i>`)
    .join("");
  document.getElementById("prevCardBtn").disabled = cardIndex === 0;
  document.getElementById("nextCardBtn").disabled = cardIndex === storyCards.length - 1;

  const card = document.getElementById("storyCard");
  card.style.transform = "translateX(0) rotate(0)";
  card.style.opacity = "1";
}

function moveCard(dir) {
  const next = cardIndex + dir;
  if (next < 0 || next >= storyCards.length) {
    const card = document.getElementById("storyCard");
    if (card) card.style.transform = "translateX(0) rotate(0)";
    return;
  }
  const card = document.getElementById("storyCard");
  card.style.opacity = "0.35";
  card.style.transform = `translateX(${dir * -24}px) rotate(${dir * -1.5}deg)`;
  setTimeout(() => {
    cardIndex = next;
    renderCard();
  }, 110);
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.getElementById("chatBackdrop")) {
    closeChat();
    return;
  }
  if (!inStoryView || document.getElementById("chatBackdrop")) return;
  if (e.key === "ArrowRight") moveCard(1);
  if (e.key === "ArrowLeft") moveCard(-1);
});

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

wireHome();
</script>
