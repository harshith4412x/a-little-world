<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f4ef">
<title>A Little World of Personalities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="profiles.js"></script>
<style>
:root {
  --ink: #22201e;
  --ink-soft: #4d4843;
  --muted: #7a746c;
  --paper: #f7f4ef;
  --card: #fffefa;
  --line: #e6dfd5;
  --line-strong: #d4c7b8;
  --accent: #a66850;
  --accent-bg: #f5ebe4;
  --accent2: #d9a78e;
  --sage: #7e9181;
  --sage-bg: #e9efe8;
  --rose-bg: #f3e8ec;
  --shadow-sm: 0 6px 24px rgba(46, 36, 27, 0.04);
  --shadow: 0 24px 64px rgba(46, 36, 27, 0.09);
  --serif: "Newsreader", Georgia, serif;
  --sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }

.app {
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  background:
    radial-gradient(circle at 88% 4%, rgba(235, 217, 203, 0.65) 0%, transparent 32%),
    radial-gradient(circle at 6% 88%, rgba(226, 236, 225, 0.65) 0%, transparent 30%),
    var(--paper);
}

/* Subtle organic paper grain */
.app::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.28;
  background-image: radial-gradient(#8c7f70 0.5px, transparent 0.5px);
  background-size: 18px 18px;
  z-index: 0;
}

.topbar, main { position: relative; z-index: 1; }

.topbar {
  max-width: 1120px;
  margin: auto;
  padding: 26px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  font-size: 12.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  cursor: pointer;
}
.brand span { color: var(--accent); }

.top-note {
  font-size: 12.5px;
  color: var(--muted);
  font-style: italic;
  font-family: var(--serif);
}

main {
  max-width: 1120px;
  margin: auto;
  padding: 28px 26px 76px;
}

.fade-in {
  animation: fadeUp 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}

.hero {
  max-width: 760px;
  margin: 30px auto 42px;
  text-align: center;
}

.hero h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(44px, 7.2vw, 78px);
  line-height: 1.01;
  letter-spacing: -0.035em;
  margin: 16px 0 18px;
}

.hero h1 em {
  font-style: italic;
  color: var(--accent);
}

.hero p {
  max-width: 500px;
  margin: 0 auto;
  color: var(--muted);
  line-height: 1.75;
  font-size: 15px;
}

.home-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  max-width: 960px;
  margin: 48px auto 0;
}

.home-card {
  min-height: 245px;
  text-align: left;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 26px;
  background: rgba(255, 254, 250, 0.85);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow-sm);
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease, border-color 0.28s ease;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.home-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow);
  border-color: var(--line-strong);
  background: var(--card);
}

.home-icon {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: var(--accent-bg);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size: 20px;
  margin-bottom: 28px;
  transition: transform 0.28s ease;
}

.home-card:hover .home-icon { transform: scale(1.06) rotate(-3deg); }
.home-card:nth-child(2) .home-icon { background: var(--sage-bg); color: #5c7060; }
.home-card:nth-child(3) .home-icon { background: var(--rose-bg); color: #9c5f73; }

.home-card h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 24px;
  margin: 0 0 10px;
  letter-spacing: -0.015em;
}

.home-card p {
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--muted);
  margin: 0;
}

.arrow {
  margin-top: auto;
  padding-top: 22px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: gap 0.2s ease;
}

.home-card:hover .arrow { gap: 9px; }

.footer {
  text-align: center;
  color: #9b9287;
  font-size: 11px;
  letter-spacing: 0.14em;
  margin-top: 58px;
}

/* Panels & Forms */
.panel {
  max-width: 720px;
  margin: 16px auto 0;
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.back {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 8px 0;
  font-size: 13px;
  font-weight: 500;
  transition: color 0.2s;
}
.back:hover { color: var(--ink); }

.step {
  font-size: 11.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

.surface {
  background: rgba(255, 254, 250, 0.95);
  border: 1px solid var(--line);
  border-radius: 30px;
  padding: clamp(26px, 5vw, 46px);
  box-shadow: var(--shadow);
}

h2.screen-title {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(30px, 4.8vw, 42px);
  line-height: 1.12;
  margin: 10px 0 14px;
  letter-spacing: -0.025em;
}

.sub {
  color: var(--muted);
  line-height: 1.7;
  font-size: 14.5px;
  margin: 0;
}

.field {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px 18px;
  background: var(--card);
  color: var(--ink);
  font-size: 15px;
  outline: none;
  margin-top: 24px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(166, 104, 80, 0.11);
}

.primary {
  border: 0;
  background: var(--ink);
  color: #fff;
  border-radius: 999px;
  padding: 14px 24px;
  font-size: 13.5px;
  font-weight: 600;
  transition: transform 0.18s ease, background 0.2s ease, box-shadow 0.2s ease;
}
.primary:hover {
  background: #363330;
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(34, 32, 30, 0.15);
}

.secondary {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  border-radius: 999px;
  padding: 13px 22px;
  font-size: 13.5px;
  font-weight: 500;
  transition: background 0.2s, border-color 0.2s;
}
.secondary:hover:not(:disabled) {
  background: #f3ede4;
  border-color: var(--line-strong);
}
.secondary:disabled { opacity: 0.4; cursor: not-allowed; }

.actions {
  display: flex;
  gap: 12px;
  justify-content: space-between;
  align-items: center;
  margin-top: 26px;
}

.progress {
  height: 4px;
  background: #ebe4da;
  border-radius: 99px;
  overflow: hidden;
  margin: 18px 0 24px;
}

.progress span {
  height: 100%;
  display: block;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

.options {
  display: grid;
  gap: 11px;
  margin-top: 24px;
}

.option {
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
  text-align: left;
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.5;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: all 0.2s ease;
}

.option::before {
  content: "";
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  flex-shrink: 0;
  transition: all 0.2s ease;
}

.option:hover {
  border-color: var(--line-strong);
  background: #fcf9f4;
}

.option.selected {
  border-color: var(--accent);
  background: var(--accent-bg);
  font-weight: 500;
}

.option.selected::before {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: inset 0 0 0 3.5px var(--accent-bg);
}

textarea {
  width: 100%;
  min-height: 84px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 16px;
  background: var(--card);
  margin-top: 16px;
  outline: none;
  font-size: 13.5px;
  line-height: 1.6;
  transition: border-color 0.2s, box-shadow 0.2s;
}

/* Search Profiles */
.person-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 24px;
}

.person {
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
  text-align: left;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}

.person:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-sm);
  border-color: var(--line-strong);
}

.person h3 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 24px;
  margin: 0 0 6px;
  color: var(--ink);
}

.person p {
  font-size: 13px;
  color: var(--muted);
  margin: 0;
  line-height: 1.55;
}

.person span {
  display: inline-block;
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  margin-top: 16px;
}

/* Story Deck */
.story-wrap {
  max-width: 700px;
  margin: 14px auto;
}

.story-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.story-count {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

.deck {
  position: relative;
  min-height: 410px;
  perspective: 1200px;
  touch-action: pan-y;
}

.deck::before, .deck::after {
  content: "";
  position: absolute;
  border-radius: 30px;
  border: 1px solid var(--line);
  transition: transform 0.3s ease;
}

.deck::before {
  inset: 14px 16px -10px;
  background: #ede4da;
  transform: rotate(2deg);
  z-index: 0;
}

.deck::after {
  inset: 7px 8px -5px;
  background: #f5eee6;
  transform: rotate(-1deg);
  z-index: 0;
}

.story-card {
  position: relative;
  z-index: 1;
  min-height: 410px;
  border-radius: 30px;
  background: var(--card);
  border: 1px solid var(--line);
  padding: clamp(28px, 6vw, 50px);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  user-select: none;
  cursor: grab;
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease;
}

.story-card:active { cursor: grabbing; }
.story-card.dragging { transition: none; }

.card-kicker {
  font-size: 10.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}

.card-title {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(31px, 5vw, 46px);
  line-height: 1.08;
  letter-spacing: -0.025em;
  margin: 18px 0 20px;
}

.card-body {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(16.5px, 2.3vw, 19.5px);
  line-height: 1.78;
  color: var(--ink-soft);
  white-space: pre-line;
}

.card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 36px;
  padding-top: 16px;
  border-top: 1px solid #f0eae1;
  color: #9a9186;
  font-size: 11px;
  letter-spacing: 0.1em;
}

.dots {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin: 26px 0 12px;
  flex-wrap: wrap;
}

.dots i {
  height: 5px;
  width: 16px;
  border-radius: 99px;
  background: #dfd6cb;
  cursor: pointer;
  transition: all 0.25s ease;
}

.dots i.active {
  background: var(--accent);
  width: 30px;
}

.swipe-hint {
  text-align: center;
  font-size: 11.5px;
  color: #9a9186;
}

.story-controls {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-top: 18px;
}

.round {
  width: 48px;
  height: 48px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--card);
  color: var(--ink);
  font-size: 17px;
  display: grid;
  place-items: center;
  transition: all 0.2s ease;
}

.round:hover:not(:disabled) {
  border-color: var(--line-strong);
  transform: scale(1.05);
}

.round.next {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}

.round.next:hover:not(:disabled) {
  background: #363330;
}

.round:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.notice {
  padding: 14px 16px;
  border-radius: 14px;
  background: var(--accent-bg);
  color: #6b4c3e;
  font-size: 13px;
  line-height: 1.55;
  margin-top: 16px;
}

/* Pulse loader */
.loader-bars {
  display: flex;
  gap: 6px;
  margin-top: 24px;
}
.loader-bars span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.2s infinite ease-in-out;
}
.loader-bars span:nth-child(2) { animation-delay: 0.2s; }
.loader-bars span:nth-child(3) { animation-delay: 0.4s; }

@keyframes pulse {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

@media (max-width: 720px) {
  .home-grid { grid-template-columns: 1fr; max-width: 470px; }
  .home-card { min-height: 185px; }
  .home-icon { margin-bottom: 18px; }
  .hero { margin-top: 16px; }
  .topbar { padding: 20px; }
  main { padding: 20px 18px 54px; }
  .person-list { grid-template-columns: 1fr; }
  .deck, .story-card { min-height: 380px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand" onclick="home()">A LITTLE <span>WORLD</span> OF PERSONALITIES</div>
    <div class="top-note">A space to understand people gently</div>
  </header>

  <main id="appMain">
    <section class="hero fade-in">
      <div class="eyebrow">A small journey inward</div>
      <h1>Every mind has<br>its own <em>little world.</em></h1>
      <p>Explore the ways people think, feel, understand and see the world. No labels. No perfect answers. Just thoughtful stories.</p>
      <div class="home-grid">
        <button class="home-card" id="discover">
          <div class="home-icon">✳</div>
          <h2>Discover your personality</h2>
          <p>Answer thoughtful questions and receive a personality story shaped by your responses.</p>
          <div class="arrow">Begin your journey <span>↗</span></div>
        </button>
        <button class="home-card" id="predefined">
          <div class="home-icon">❀</div>
          <h2>Explore personalities</h2>
          <p>Meet the personalities already written and explore their stories, one card at a time.</p>
          <div class="arrow">Explore stories <span>↗</span></div>
        </button>
        <button class="home-card" id="private">
          <div class="home-icon">♡</div>
          <h2>Know me better</h2>
          <p>A personal space with a little more to discover. Password protected.</p>
          <div class="arrow">Enter privately <span>↗</span></div>
        </button>
      </div>
      <div class="footer">MADE WITH CURIOSITY & CARE</div>
    </section>
  </main>
</div>

<script>
const WORKER_URL = "https://gentle-wood-0b71.harshith4412x.workers.dev/";
const main = document.getElementById("appMain");
const homeMarkup = main.innerHTML;

const questions = [
  { category: "Perception", question: "When something unexpected happens, what do you usually do first?", options: ["I consider different possible explanations", "I focus on the details I notice first", "I trust my immediate impression", "I pause and gather more information"] },
  { category: "Belief systems", question: "When forming an opinion, what tends to influence you most?", options: ["My past experiences", "Values and principles that matter to me", "Evidence and information I can verify", "A mix of different perspectives"] },
  { category: "Belief updating", question: "If you encounter strong evidence against something you believe, what do you tend to do?", options: ["Reconsider my view and look closer", "Take time before changing my mind", "Ask questions and compare both sides", "It depends on how important the belief is"] },
  { category: "Memory and prediction", question: "How much do past experiences shape what you expect next?", options: ["A lot; I often use past patterns", "Somewhat, but I try to stay open", "I focus more on what is happening now", "It depends on the situation"] },
  { category: "Intuition and reasoning", question: "When making an important decision, what do you rely on first?", options: ["My intuition or gut feeling", "Careful reasoning and comparison", "I use intuition, then check it logically", "I ask someone I trust for perspective"] },
  { category: "Metacognition", question: "How often do you step back and examine your own thinking?", options: ["Often; I reflect on why I think this way", "Sometimes, especially after a big decision", "Mostly when something goes wrong", "Not very often; I prefer to act"] },
  { category: "Perspective-taking", question: "When someone disagrees with you, what do you usually try to understand?", options: ["What experiences shaped their view", "The reasons and evidence behind their view", "How they might be feeling", "I first explain how I see it"] },
  { category: "Motives and priorities", question: "In a difficult situation, what matters most to you?", options: ["Feeling safe and prepared", "Maintaining important relationships", "Solving the problem effectively", "Being treated fairly and respectfully"] },
  { category: "Emotion and cognition", question: "How does stress or a strong emotion affect your thinking?", options: ["I become more cautious and think deeply", "I act quickly and process it later", "My thoughts become less organised", "I try to pause until I feel calmer"] },
  { category: "Social and cultural influences", question: "How do your upbringing and surroundings influence your choices?", options: ["They strongly shape my values", "They influence me, but I question things too", "I consciously choose what to keep or change", "I am still figuring out their influence"] }
];

let visitorName = "", answers = [], qIndex = 0, selected = -1, storyCards = [], cardIndex = 0, dragStart = null, inStoryView = false;

function home() {
  inStoryView = false;
  main.innerHTML = homeMarkup;
  wireHome();
}

function wireHome() {
  document.getElementById("discover").onclick = nameScreen;
  document.getElementById("predefined").onclick = predefinedScreen;
  document.getElementById("private").onclick = privateScreen;
}

function shell(content) {
  inStoryView = false;
  main.innerHTML = `<div class="panel fade-in"><div class="panel-head"><button class="back" onclick="home()">← Back to home</button><span class="step">A LITTLE WORLD</span></div>${content}</div>`;
}

function nameScreen() {
  shell(`
    <section class="surface">
      <div class="eyebrow">Start with your name</div>
      <h2 class="screen-title">Let's begin with you.</h2>
      <p class="sub">There are no right or wrong answers. Just choose what feels closest to how you usually think.</p>
      <input class="field" id="visitorName" maxlength="60" placeholder="Your name" value="${escapeHtml(visitorName)}">
      <div id="nameNotice"></div>
      <div class="actions">
        <span></span>
        <button class="primary" onclick="startQuestions()">Continue →</button>
      </div>
    </section>
  `);
  const input = document.getElementById("visitorName");
  input.focus();
  input.addEventListener("keydown", e => { if (e.key === "Enter") startQuestions(); });
}

function startQuestions() {
  visitorName = document.getElementById("visitorName").value.trim();
  if (!visitorName) {
    document.getElementById("nameNotice").innerHTML = '<div class="notice">Please enter your name to begin.</div>';
    return;
  }
  answers = [];
  qIndex = 0;
  renderQuestion();
}

function renderQuestion() {
  const q = questions[qIndex];
  selected = answers[qIndex]?.selected ?? -1;
  const explanation = answers[qIndex]?.explanation || "";
  shell(`
    <section class="surface">
      <div class="eyebrow">${q.category}</div>
      <div class="progress"><span style="width:${((qIndex + 1) / questions.length) * 100}%"></span></div>
      <div class="step">QUESTION ${qIndex + 1} OF ${questions.length}</div>
      <h2 class="screen-title">${q.question}</h2>
      <div class="options">
        ${q.options.map((o, i) => `<button class="option ${i === selected ? "selected" : ""}" onclick="choose(${i})">${o}</button>`).join("")}
      </div>
      <textarea id="explanation" placeholder="Want to add a quick thought on why? (optional)">${escapeHtml(explanation)}</textarea>
      <div id="qNotice"></div>
      <div class="actions">
        <button class="secondary" onclick="previousQuestion()" ${qIndex === 0 ? "disabled" : ""}>← Previous</button>
        <button class="primary" onclick="nextQuestion()">${qIndex === 9 ? "Create my story ✨" : "Next →"}</button>
      </div>
    </section>
  `);
}

function choose(i) {
  selected = i;
  document.getElementById("qNotice").innerHTML = "";
  document.querySelectorAll(".option").forEach((el, n) => el.classList.toggle("selected", n === i));
}

function saveAnswer() {
  const explanation = document.getElementById("explanation")?.value || "";
  if (selected < 0) {
    document.getElementById("qNotice").innerHTML = '<div class="notice">Choose the option that feels closest to you before continuing.</div>';
    return false;
  }
  answers[qIndex] = {
    category: questions[qIndex].category,
    question: questions[qIndex].question,
    choice: questions[qIndex].options[selected],
    explanation,
    selected
  };
  return true;
}

function nextQuestion() {
  if (!saveAnswer()) return;
  if (qIndex < 9) {
    qIndex++;
    renderQuestion();
  } else {
    generatePublicStory();
  }
}

function previousQuestion() {
  if (qIndex > 0) {
    const exp = document.getElementById("explanation")?.value || "";
    if (selected >= 0) answers[qIndex] = { ...answers[qIndex], selected, explanation: exp };
    qIndex--;
    renderQuestion();
  }
}

async function generatePublicStory() {
  shell(`
    <section class="surface">
      <div class="eyebrow">Your story is taking shape</div>
      <h2 class="screen-title">A moment of understanding…</h2>
      <p class="sub">Turning your reflections into a thoughtful personality story. This usually takes a few seconds.</p>
      <div class="loader-bars"><span></span><span></span><span></span></div>
    </section>
  `);
  try {
    const r = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: visitorName,
        answers: answers.map(a => ({
          category: a.category,
          question: a.question,
          choice: a.choice,
          explanation: a.explanation || ""
        }))
      })
    });
    const d = await r.json();
    if (!r.ok) throw Error(d.error || "The story could not be created.");
    showStory(d.story, visitorName);
  } catch (e) {
    shell(`
      <section class="surface">
        <div class="eyebrow">Something paused</div>
        <h2 class="screen-title">We couldn't create the story.</h2>
        <p class="sub">${escapeHtml(e.message)}</p>
        <div class="actions"><span></span><button class="primary" onclick="renderQuestion()">Try again</button></div>
      </section>
    `);
  }
}

function predefinedScreen() {
  shell(`
    <section class="surface">
      <div class="eyebrow">Explore Personalities</div>
      <h2 class="screen-title">Find a personality.</h2>
      <p class="sub">Search for a name to discover their story.</p>
      <input class="field" id="personSearch" placeholder="Type a name to search..." autocomplete="off">
      <div id="personResults" class="person-list" aria-live="polite"></div>
    </section>
  `);

  const search = document.getElementById("personSearch");
  const results = document.getElementById("personResults");
  search.focus();

  search.addEventListener("input", () => {
    const query = search.value.trim().toLowerCase();
    results.innerHTML = "";
    if (!query) return;

    const profiles = window.originalProfiles || {};
    const matches = Object.entries(profiles).filter(([key, profile]) =>
      (profile.displayName || key).toLowerCase().includes(query)
    );

    if (!matches.length) {
      results.innerHTML = '<p class="sub" style="grid-column:1/-1;">No matching personalities found.</p>';
      return;
    }

    matches.forEach(([key, profile]) => {
      const button = document.createElement("button");
      button.className = "person";
      button.type = "button";
      const traitCount = Array.isArray(profile.traits) ? profile.traits.length : 0;
      button.innerHTML = `
        <div>
          <h3>${escapeHtml(profile.displayName || key)}</h3>
          <p>${traitCount ? `${traitCount} chapters inside this story` : "Written personality story"}</p>
        </div>
        <span>Read story ↗</span>
      `;
      button.addEventListener("click", () => openPredefined(key));
      results.appendChild(button);
    });
  });
}

function openPredefined(key) {
  const p = window.originalProfiles?.[key];
  if (!p) {
    alert("The original profiles.js file could not be loaded.");
    return;
  }
  showStory(p, p.displayName || key);
}

function privateScreen() {
  shell(`
    <section class="surface">
      <div class="eyebrow">A private little world</div>
      <h2 class="screen-title">Know me better.</h2>
      <p class="sub">This story is protected. Enter the private password to continue.</p>
      <input class="field" id="privatePassword" type="password" placeholder="Enter password" autocomplete="current-password">
      <div id="privateError"></div>
      <div class="actions">
        <span></span>
        <button class="primary" onclick="loadPrivate()">Unlock story →</button>
      </div>
    </section>
  `);
  const pwd = document.getElementById("privatePassword");
  pwd.focus();
  pwd.addEventListener("keydown", e => { if (e.key === "Enter") loadPrivate(); });
}

async function loadPrivate() {
  const password = document.getElementById("privatePassword").value;
  if (!password) {
    document.getElementById("privateError").innerHTML = '<div class="notice">Please enter the password.</div>';
    return;
  }
  shell(`
    <section class="surface">
      <div class="eyebrow">Unlocking</div>
      <h2 class="screen-title">Opening the private story…</h2>
      <p class="sub">Just a moment.</p>
      <div class="loader-bars"><span></span><span></span><span></span></div>
    </section>
  `);
  try {
    const r = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "private-profile", password })
    });
    const d = await r.json();
    if (!r.ok) throw Error(d.error || "Unable to unlock profile.");
    showStory(d.story, "Harsha");
  } catch (e) {
    shell(`
      <section class="surface">
        <div class="eyebrow">Access denied</div>
        <h2 class="screen-title">Couldn't unlock the story.</h2>
        <p class="sub">${escapeHtml(e.message)}</p>
        <div class="actions"><span></span><button class="primary" onclick="privateScreen()">Try again</button></div>
      </section>
    `);
  }
}

function showStory(profile, name) {
  const traits = Array.isArray(profile.traits) ? profile.traits : [];
  storyCards = [];
  traits.forEach((t, i) => storyCards.push({
    kicker: `PERSONALITY · ${String(i + 1).padStart(2, "0")}`,
    title: t.title || "A little detail",
    body: t.description || "",
    label: `${escapeHtml(name)} · ${i + 1} / ${traits.length}`
  }));

  const sections = [
    ["strengths", "MY STRENGTHS"],
    ["cons", "THINGS I'M WORKING ON"],
    ["observations", "OTHER OBSERVATIONS"],
    ["personalMessage", "A PERSONAL MESSAGE"]
  ];

  sections.forEach(([key, label]) => {
    const value = profile[key];
    if (Array.isArray(value)) {
      value.forEach(v => storyCards.push({
        kicker: label,
        title: typeof v === "string" ? label : (v.title || label),
        body: typeof v === "string" ? v : (v.description || v.text || ""),
        label: escapeHtml(name)
      }));
    } else if (typeof value === "string" && value.trim()) {
      storyCards.push({
        kicker: label,
        title: label,
        body: value,
        label: escapeHtml(name)
      });
    }
  });

  if (profile.ending) {
    storyCards.push({
      kicker: "A FINAL THOUGHT",
      title: "A little something to remember",
      body: profile.ending,
      label: "THE END"
    });
  }

  cardIndex = 0;
  inStoryView = true;

  main.innerHTML = `
    <div class="story-wrap fade-in">
      <div class="story-top">
        <button class="back" onclick="home()">← Home</button>
        <span class="story-count" id="storyCount"></span>
      </div>
      <div class="deck" id="deck">
        <article class="story-card" id="storyCard">
          <div>
            <div class="card-kicker" id="cardKicker"></div>
            <h2 class="card-title" id="cardTitle"></h2>
            <div class="card-body" id="cardBody"></div>
          </div>
          <div class="card-bottom">
            <span id="cardLabel"></span>
            <span>SWIPE OR USE ARROWS</span>
          </div>
        </article>
      </div>
      <div class="dots" id="dots"></div>
      <div class="swipe-hint">Drag the card, click the dots, or use arrow keys</div>
      <div class="story-controls">
        <button class="round" id="prevCardBtn" onclick="moveCard(-1)" aria-label="Previous card">←</button>
        <button class="round next" id="nextCardBtn" onclick="moveCard(1)" aria-label="Next card">→</button>
      </div>
    </div>
  `;

  renderCard();

  const deck = document.getElementById("deck");
  const card = document.getElementById("storyCard");

  deck.addEventListener("pointerdown", e => {
    dragStart = { x: e.clientX, y: e.clientY };
    card.classList.add("dragging");
  });

  deck.addEventListener("pointermove", e => {
    if (!dragStart) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      const rotate = dx * 0.04;
      card.style.transform = `translateX(${dx * 0.45}px) rotate(${rotate}deg)`;
    }
  });

  const endDrag = e => {
    if (!dragStart) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    dragStart = null;
    card.classList.remove("dragging");
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      moveCard(dx < 0 ? 1 : -1);
    } else {
      card.style.transform = "translateX(0) rotate(0)";
    }
  };

  deck.addEventListener("pointerup", endDrag);
  deck.addEventListener("pointercancel", () => {
    dragStart = null;
    card.classList.remove("dragging");
    card.style.transform = "translateX(0) rotate(0)";
  });
}

function jumpCard(i) {
  cardIndex = i;
  renderCard();
}

function renderCard() {
  const c = storyCards[cardIndex];
  if (!c) return;
  document.getElementById("cardKicker").textContent = c.kicker;
  document.getElementById("cardTitle").textContent = c.title;
  document.getElementById("cardBody").textContent = c.body;
  document.getElementById("cardLabel").innerHTML = c.label;
  document.getElementById("storyCount").textContent = `CARD ${cardIndex + 1} OF ${storyCards.length}`;
  document.getElementById("dots").innerHTML = storyCards
    .map((_, i) => `<i class="${i === cardIndex ? "active" : ""}" onclick="jumpCard(${i})"></i>`)
    .join("");
  document.getElementById("prevCardBtn").disabled = cardIndex === 0;
  document.getElementById("nextCardBtn").disabled = cardIndex === storyCards.length - 1;

  const card = document.getElementById("storyCard");
  card.style.transform = "translateX(0) rotate(0)";
  card.style.opacity = "1";
}

function moveCard(dir) {
  const next = cardIndex + dir;
  if (next < 0 || next >= storyCards.length) {
    const card = document.getElementById("storyCard");
    if (card) card.style.transform = "translateX(0) rotate(0)";
    return;
  }
  const card = document.getElementById("storyCard");
  card.style.opacity = "0.35";
  card.style.transform = `translateX(${dir * -24}px) rotate(${dir * -1.5}deg)`;
  setTimeout(() => {
    cardIndex = next;
    renderCard();
  }, 110);
}

document.addEventListener("keydown", e => {
  if (!inStoryView) return;
  if (e.key === "ArrowRight") moveCard(1);
  if (e.key === "ArrowLeft") moveCard(-1);
});

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

wireHome();
</script>
</body>
</html>
